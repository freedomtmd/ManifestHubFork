name: Daily Sync DepotKeys

on:
  # 定时每日运行 UTC 0点，对应北京时间早上8点；可自行修改cron
  schedule:
    - cron: '0 0 * * *'
  # 支持手动点击运行
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download depotkeys.json
        run: |
          wget -O depotkeys.json https://api.993499094.xyz/depotkeys.json

      - name: Zip the json file
        run: |
          zip depotkeys.zip depotkeys.json

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit & Push changes
        run: |
          git add depotkeys.zip
          git status
          git diff --cached --quiet || {
            git commit -m "🤖 Auto sync depotkeys $(date '+%Y-%m-%d')"
            git push origin main
          }
